<!--
  Single-page-app HTML shell served by Vite. The only meaningful content is the empty
  #root div that main.tsx mounts the React tree into and the module script tag that loads
  the app's entry point - everything else about the UI is rendered by React at runtime.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bud(dy)get</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
