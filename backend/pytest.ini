[pytest]
asyncio_mode = auto
; Without this, `pytest` (run as a bare console script, e.g. via
; `docker compose exec backend pytest`) never adds /app to sys.path - only
; `python -m pytest` does that automatically - so `tests/conftest.py`'s `from app...`
; imports fail with "No module named 'app'" even though the same imports work fine
; inside the app itself (started via `uvicorn app.main:app`, a different entry point).
pythonpath = .
