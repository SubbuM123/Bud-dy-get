# Render Blueprint - deploy with "New > Blueprint" in the Render dashboard, pointed at
# this repo. Docs: https://render.com/docs/blueprint-spec
#
# DATABASE_URL and CORS_ORIGINS are marked sync: false (not auto-generated) - fill them
# in via the Render dashboard after the blueprint is created. SECRET_KEY and CRON_SECRET
# are generated automatically. CRON_SECRET also needs to be added as a GitHub Actions
# secret (same value) - see .github/workflows/scheduler.yml.
#
# Only one service, on the free plan - no credit card required. The daily scheduler is
# not a Render Cron Job (those have no free tier); it's triggered by a GitHub Actions
# scheduled workflow calling POST /cron/run-scheduler instead.

services:
  # FastAPI backend
  - type: web
    name: personal-finance-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile.prod
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: CORS_ORIGIN_REGEX
        value: https://.*\.vercel\.app
      - key: DEBUG
        value: "false"
    # Migrations run inside the container's CMD (Dockerfile.prod), not here -
    # preDeployCommand isn't available on the free plan.
